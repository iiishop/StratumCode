[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratumcode"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
    "pygobject>=3.56.3 ; sys_platform == 'linux'",
    "pyqt6>=6.11.0 ; sys_platform == 'linux'",
    "pyqt6-webengine>=6.11.0 ; sys_platform == 'linux'",
    "pywebview>=6.2.1",
    "pyyaml>=6.0",
    "qtpy>=2.4.3 ; sys_platform == 'linux'",
]

[project.scripts]
stratumcode = "stratumcode.main:main"
stratumcode-dev = "stratumcode.main:main_dev"
